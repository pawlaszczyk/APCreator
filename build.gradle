
plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.runtime' version '1.13.1'
    id "de.undercouch.download" version "5.6.0"
}

group 'hsmw.apm'
version '1.2'

def currentOs = org.gradle.internal.os.OperatingSystem.current()

application {
    mainClass.set("apm.APMCreator")
}


repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs "resources"
        }
        
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(20)
    }
}

javafx {
    version = "22"
    modules = [
            'javafx.base',
            'javafx.controls',
            'javafx.swing',
            'javafx.web',
            'javafx.fxml',
            'javafx.graphics',
            'javafx.media'
    ]
}

jar {
    manifest {
        attributes(
                'Main-Class': 'amp.APMCreator'
        )
    }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'

dependencies {
    implementation group: 'org.fxmisc.richtext', name: 'richtextfx', version: '0.11.0'
    implementation group: 'de.kherud', name: 'llama', version: '4.2.0'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'apm.APMCreator'
        )
    }
}

