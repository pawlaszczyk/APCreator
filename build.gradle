
plugins {
  id 'java'
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.0.13'
    id 'org.beryx.runtime' version '1.13.1'
}

def currentOs = org.gradle.internal.os.OperatingSystem.current()

group 'hsmw.creator'
version '1.0'

application {
    mainClassName = "hsmw.creator.APMCreator"
}

repositories {
  mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

java{
    toolchain {
        languageVersion = JavaLanguageVersion.of(20)
    }
}

javafx {
    version = '21'
    modules = ['javafx.controls', 'javafx.fxml','javafx.web']
}

jar {
    manifest {
        attributes(
                'Main-Class': 'hsmw.creator.APMCreator'
        )
    }
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'
javadoc.options.encoding = 'UTF-8'

dependencies {
  implementation group: 'org.fxmisc.richtext', name: 'richtextfx', version: '0.11.0'
}


jar {
    manifest {
        attributes(
                'Main-Class': 'hsmw.creator.APMCreator'
        )
    }
}

// Runtime for non-modular projects
runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    launcher {
        noConsole = true
    }

    jpackage {
        installerOptions += ['--resource-dir',"src/main/resources"]

        if (currentOs.windows) {
            installerOptions += ['--win-per-user-install', '--win-dir-chooser', '--win-menu', '--win-shortcut']
        } else if (currentOs.linux) {
            installerOptions += ['--linux-package-name', 'apcreator', '--linux-shortcut']
        } else if (currentOs.macOsX) {
            installerOptions += ['--mac-package-name', 'apcreator']
        }
    }
}


